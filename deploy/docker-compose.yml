services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/aradhyac:/srv/aradhyac:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - editor
      - sessions

  editor:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    env_file: ./editor.env
    volumes:
      - ./editor:/app:ro
    expose:
      - "8080"

  sessions:
    build: ./sessions
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./sessions:/app:ro
      - sessions-data:/data
    environment:
      - SESSIONS_FILE=/data/sessions.json
    expose:
      - "8080"

volumes:
  caddy_data:
  caddy_config:
  sessions-data:
